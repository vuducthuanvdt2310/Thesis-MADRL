    - [0.7, 0.7, 0.7]  # Retailer_13
    - [0.7, 0.7, 0.7]  # Retailer_14

  # Variable costs: (15 retailers, 4 DCs, 3 SKUs)
  variable_cost_retailer:
    - [ [0.5, 0.6, 0.7], [0.5, 0.6, 0.7], [0.5, 0.6, 0.7], [0.5, 0.6, 0.7] ]  # R0
    - [ [0.5, 0.6, 0.7], [0.5, 0.6, 0.7], [0.5, 0.6, 0.7], [0.5, 0.6, 0.7] ]  # R1
    - [ [0.5, 0.6, 0.7], [0.5, 0.6, 0.7], [0.5, 0.6, 0.7], [0.5, 0.6, 0.7] ]  # R2
