    - [0.1, 0.1, 0.2]  # Retailer_10
    - [0.1, 0.1, 0.2]  # Retailer_11
    - [0.1, 0.1, 0.2]  # Retailer_12
    - [0.1, 0.1, 0.2]  # Retailer_13
    - [0.1, 0.1, 0.2]  # Retailer_14

  backlog_cost_retailer:
    - [6, 6, 6]  # Retailer_0
    - [6, 6, 6]  # Retailer_1
    - [6, 6, 6]  # Retailer_2
    - [6, 6, 6]  # Retailer_3
    - [6, 6, 6]  # Retailer_4
