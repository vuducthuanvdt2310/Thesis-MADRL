# Multi-DC 2-Echelon Inventory Environment Configuration
# SCALED: 1 Supplier → 4 DCs → 15 Retailers (19 agents total)

environment:
  n_skus: 3
  n_dcs: 4
  n_retailers: 15
  max_days: 365

  lead_time:
    supplier_to_dc:
      distribution: "uniform"
      min: 7
      max: 14
    dc_to_retailer:
      distribution: "fixed"
      min: 1
      max: 1

# DC-to-Retailer exclusive assignment (4+4+4+3 = 15)
# Agent IDs: DC0=0, DC1=1, DC2=2, DC3=3, Retailers=4..18
dc_assignments:
  dc_0: [0, 1, 2, 3]
  dc_1: [4, 5, 6, 7]
  dc_2: [8, 9, 10, 11]
  dc_3: [12, 13, 14]

constraints:
  safety_stock_threshold:
    - [5.0, 5.0, 5.0]  # Retailer_0
    - [5.0, 5.0, 5.0]  # Retailer_1
    - [5.0, 5.0, 5.0]  # Retailer_2
    - [5.0, 5.0, 5.0]  # Retailer_3
    - [5.0, 5.0, 5.0]  # Retailer_4
    - [5.0, 5.0, 5.0]  # Retailer_5
    - [5.0, 5.0, 5.0]  # Retailer_6
    - [5.0, 5.0, 5.0]  # Retailer_7
    - [5.0, 5.0, 5.0]  # Retailer_8
    - [5.0, 5.0, 5.0]  # Retailer_9
    - [5.0, 5.0, 5.0]  # Retailer_10
    - [5.0, 5.0, 5.0]  # Retailer_11
    - [5.0, 5.0, 5.0]  # Retailer_12
    - [5.0, 5.0, 5.0]  # Retailer_13
    - [5.0, 5.0, 5.0]  # Retailer_14
  safety_stock_penalty: 1.0

rewards:
  survival_reward: 0.0
  termination_penalty: 50.0
  sale_revenue_retailer: 2.5
  holding_weight: 0.3
  backlog_weight: 1.5
  ordering_weight: 0.1
  target_stock_days_retailer: 8
  target_stock_days_dc: 14
  excess_penalty_retailer: 0.3
  excess_penalty_dc: 0.03
  alpha: 0.2
  heuristic_shaping:
    enabled: true
    k: 0.5
    demand_window: 14
    initial_weight: 1.0

costs:
  # DC Costs (4 DCs x 3 SKUs)
  holding_cost_dc:
    - [0.05, 0.05, 0.05]  # DC_0
    - [0.05, 0.05, 0.05]  # DC_1
    - [0.05, 0.05, 0.05]  # DC_2
    - [0.05, 0.05, 0.05]  # DC_3

  backlog_cost_dc:
    - [3.0, 2.5, 4.0]  # DC_0
    - [3.0, 2.5, 4.0]  # DC_1
    - [3.0, 2.5, 4.0]  # DC_2
    - [3.0, 2.5, 4.0]  # DC_3

  fixed_order_cost_dc:
    - [2.0, 2.0, 2.0]  # DC_0
    - [2.0, 2.0, 2.0]  # DC_1
    - [2.0, 2.0, 2.0]  # DC_2
    - [2.0, 2.0, 2.0]  # DC_3

  # Retailer Costs (15 Retailers x 3 SKUs)
  holding_cost_retailer:
    - [0.1, 0.1, 0.2]  # Retailer_0
    - [0.1, 0.1, 0.2]  # Retailer_1
    - [0.1, 0.1, 0.2]  # Retailer_2
    - [0.1, 0.1, 0.2]  # Retailer_3
    - [0.1, 0.1, 0.2]  # Retailer_4
